name: Refrescar reporte Futura

on:
  schedule:
    - cron: '0 11 * * 1'    # cada lunes 11:00 UTC (6:00 a.m. Colombia)
  workflow_dispatch:          # permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar datos desde Meta
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: '1270090183944073'
        run: node fetch-data.js

      - name: Publicar los datos actualizados
        run: |
          git config user.name "futura-bot"
          git config user.email "bot@users.noreply.github.com"
          git add futura-data.js
          git commit -m "Datos actualizados $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
